check: state-machine
description: |
  A boolean toggle state machine over 3 Unit events. Initial state is
  false; after 3 toggles the final state is true.
events:
  - {tag: unit}
  - {tag: unit}
  - {tag: unit}
final_state:
  python: "True"
  strand: "BoolV(v=true)"
outputs:
  python: "[]"
  strand: "[]"
